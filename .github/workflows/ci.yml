name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile scorer
        run: python -m py_compile score_eval.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify report-derived fixture
        run: >-
          python score_eval.py
          --cases cases.jsonl
          --transcript transcripts/task1_report_fixture.json
          --out /tmp/results.json
          --summary-only

      - name: Verify recorded Task 1 trace fixture
        run: >-
          python score_eval.py
          --cases transcripts/task1_case.jsonl
          --transcript transcripts/task1_actual_redacted.json
          --out /tmp/results-task1.json
          --summary-only

      - name: Validate safe probe accounting
        run: >-
          python -c "import json; r=json.load(open('results_20_scenario_run.json'));
          assert r['total'] == 20;
          assert r['direct_read_only_tool_scenarios_executed'] == 11;
          assert r['no_tool_call_paths_manually_reviewed'] == 4;
          assert r['write_capable_scenarios_blocked'] == 5;
          assert r['live_writes_attempted'] == 0;
          assert r['tool_selection_accuracy'] is None"
